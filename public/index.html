<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AzureHub</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt=""> AzureHub <span class="badge beta">BETA</span></div>
    <nav id="nav" class="nav hidden" aria-label="Telas">
      <a href="#integracao" data-view="integracao">Integração</a>
      <a href="#produtos" data-view="produtos">Produtos</a>
      <a href="#precificacao" data-view="precificacao" id="nav-pricing" class="hidden">Precificação</a>
      <a href="#previa" data-view="previa">Prévia</a>
      <a href="#sincronizacao" data-view="sincronizacao">Sincronização</a>
    </nav>
    <div class="top-right">
      <span id="version" class="muted"></span>
      <button id="btn-logout" class="ghost hidden">Sair</button>
    </div>
  </header>

  <main id="app"><p class="muted center">Carregando…</p></main>

  <div id="toast" class="toast hidden" role="status"></div>

  <dialog id="dlg">
    <form method="dialog" id="dlg-form">
      <h3 id="dlg-title"></h3>
      <div id="dlg-body"></div>
      <div class="actions">
        <button value="cancel" class="ghost" formnovalidate>Cancelar</button>
        <button value="ok" id="dlg-ok" class="primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="drawer" class="drawer">
    <div class="drawer-head">
      <h3 id="drawer-title"></h3>
      <button class="ghost" id="drawer-close" aria-label="Fechar">✕</button>
    </div>
    <div id="drawer-body"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
